name: Lua tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lua51:
    name: Lua 5.1
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
      - name: Run progress tests
        run: lua5.1 tests/test_progress.lua
      - name: Run Forever Core registry tests
        run: lua5.1 tests/test_core.lua
      - name: Run Forever Warrior advisory tests
        run: lua5.1 tests/test_warrior.lua
      - name: Run suite integration tests
        run: lua5.1 tests/test_suite.lua
      - name: Run Journal quest log tests
        run: lua5.1 tests/test_questlog.lua
      - name: Run Journal history tests
        run: lua5.1 tests/test_history.lua
      - name: Run Journal catalog tests
        run: lua5.1 tests/test_journal.lua
      - name: Run Journal Core bridge tests
        run: lua5.1 tests/test_journal_bridge.lua
      - name: Run Forever Performance memory tests
        run: lua5.1 tests/test_performance.lua
      - name: Run Forever Gold session wallet tests
        run: lua5.1 tests/test_gold.lua
      - name: Run Forever Professions skill tests
        run: lua5.1 tests/test_professions.lua
