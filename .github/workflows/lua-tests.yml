name: Lua tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lua51:
    name: Lua 5.1
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
      - name: Run progress tests
        run: lua5.1 tests/test_progress.lua
      - name: Run mocked quest log tests
        run: lua5.1 tests/test_questlog.lua
      - name: Run historical flag and identity tests
        run: lua5.1 tests/test_history.lua
      - name: Run curated starter journal tests
        run: lua5.1 tests/test_journal.lua
