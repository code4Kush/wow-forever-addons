# Public-repository CI runs untrusted pull-request code on isolated runners.
# Keep token access read-only, never use pull_request_target, and never
# expose deployment credentials or personal data to these test jobs.
name: Lua tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: lua-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lua51:
    name: Lua 5.1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source without retaining Git credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check tracked files for accidental credentials
        run: python3 scripts/check_public_repo.py

      - name: Test the public safety scanner
        run: python3 -m unittest discover -s tests -p 'test_public_security.py'

      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1

      - name: Run progress tests
        run: lua5.1 tests/test_progress.lua
